# Applies the migrations a push to `main` added, or one named by hand.
#
# The apply script is the only path to the database (docs/project.md §7). It takes a
# migration's version, fetches the file from merged main, and writes the row the
# platform records. Nothing in this file talks to Postgres, and no project is named
# here: the script resolves the project from packages/db/supabase-projects.json and
# refuses anything that is not permitted to be written to.
#
# The one credential this needs is SUPABASE_ACCESS_TOKEN, a repository secret the
# product owner adds (Settings -> Secrets and variables -> Actions). Until it is
# there, this job fails on purpose, with a message that says so.
#
# There are two ways in, and both go through the same script and the same guards:
#
#   - a push to `main` that touches supabase/migrations/** applies the files that
#     push added, in file-name order. This is the path that runs by itself.
#   - a workflow_dispatch applies the one version its input names, found in the
#     checkout. There is no push and so no diff to read: the version comes from
#     the input. This is the path for a version that has to be applied by hand.
#
# The guards do not move with the trigger. The script fetches the file from merged
# main, so a hand-run applies the bytes that were merged and reviewed, and it
# refuses a version that is not there, a file that is not the one the run verified,
# and a row that is already there. A hand-run can therefore apply nothing that the
# push path would not apply. The product owner still applies migrations to
# production; this touches the dev project and only that.
name: Apply migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  # The apply can be run by hand for one version. The version is the migration
  # file's own UTC timestamp, e.g. 20261110035018.
  workflow_dispatch:
    inputs:
      version:
        description: "The version to apply — the migration file's own UTC timestamp, e.g. 20261110035018."
        required: true
        type: string

# One apply at a time. Two pushes that land close together must not race for the same
# table, and the second one has to see the first one's row.
concurrency:
  group: apply-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply the migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The whole history: the files this push added are found by diffing the
          # push's "before" commit against its "after" commit.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply the migrations this push added
        if: github.event_name == 'push'
        env:
          # The product owner's repository secret. The script needs it, and nothing
          # else does: no key, no URL, no project.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # This workflow's own token, so the script can read the repository through
          # the API without spending the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. The product owner adds it as a repository secret (Settings -> Secrets and variables -> Actions -> New repository secret). Nothing is applied without it."
            exit 1
          fi

          before="${BEFORE_SHA}"
          after="${AFTER_SHA:-HEAD}"

          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::This push has no 'before' commit, so the files it added cannot be found. Refusing to guess which migrations to apply."
            exit 1
          fi

          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "::error::The 'before' commit ${before} is not in this checkout."
            exit 1
          fi

          # A merged migration is never edited, so a migration this push *changed*
          # rather than added is a mistake worth stopping for: the database already
          # holds the old bytes under that version, and applying the new ones would
          # leave the database and main disagreeing. A rename is an edit too, and a
          # file moved *out* of the directory reads as a deletion here: git pairs the
          # two sides of a rename only when both of them are in the diff.
          if ! changed_files="$(git diff --name-only --diff-filter=MRD "${before}" "${after}" -- 'supabase/migrations/**')"; then
            echo "::error::Could not diff ${before} against ${after}."
            exit 1
          fi

          if [ -n "${changed_files}" ]; then
            echo "::error::This push changes a migration that is already merged:"
            printf '  %s\n' "${changed_files}"
            echo "::error::A merged migration is never edited, renamed or removed. Add a new migration file instead."
            exit 1
          fi

          # The migration files this push added, in file-name order — the order the
          # versions sort in, which is the order they are applied in. LC_ALL=C, so the
          # order is the bytes' order and not the runner's locale's.
          if ! added_files="$(git diff --name-only --diff-filter=A "${before}" "${after}" -- 'supabase/migrations/**' | LC_ALL=C sort)"; then
            echo "::error::Could not diff ${before} against ${after}."
            exit 1
          fi

          added=()

          if [ -n "${added_files}" ]; then
            while IFS= read -r file; do
              added+=("${file}")
            done <<< "${added_files}"
          fi

          if [ "${#added[@]}" -eq 0 ]; then
            echo "This push added no migration file. Nothing to apply."
            exit 0
          fi

          echo "This push added ${#added[@]} migration file(s):"
          printf '  %s\n' "${added[@]}"

          for file in "${added[@]}"; do
            name="${file##*/}"

            # A migration's version is its own UTC timestamp. The script is given
            # the version, never a path — a path would let arbitrary SQL be recorded
            # as a migration.
            if [[ ! "${name}" =~ ^([0-9]{14})_[A-Za-z0-9_-]+\.sql$ ]]; then
              echo "::error::The file ${name} is not named <timestamp>_<name>.sql. A migration's version is its own UTC timestamp, so there is no version to apply."
              exit 1
            fi

            version="${BASH_REMATCH[1]}"

            # The script records the row's `created_by` from this checkout's git
            # identity, and the rows already on dev carry the address of the commit
            # that wrote the migration. A checkout has no identity of its own, so it
            # is set here — otherwise the first workflow-applied row would be the
            # first one without an address. It is set for every file, empty and all,
            # so one migration's author can never be recorded against the next.
            # The address ends up in supabase_migrations.schema_migrations, so it is
            # the author's address and not the runner's — the same thing the
            # platform's own apply records.
            author="$(git log -1 --format='%ae' -- "${file}")"
            git config user.email "${author}"

            # The bytes this push reviewed, so the script refuses if the file on
            # merged main is not the same file.
            sha256="$(sha256sum "${file}" | cut -d' ' -f1)"

            echo "::group::Applying ${version}"
            # The script is `packages/db`'s `db:apply`, run from its own package. Not
            # `pnpm --filter`: a filter that matches no package exits 0 and applies
            # nothing, and this job must not be able to succeed without applying.
            (cd packages/db && pnpm db:apply "${version}" --expect-sha256 "${sha256}") || {
              echo "::endgroup::"
              echo "::error::db:apply refused ${version}. The job fails on purpose — a refusal must be loud. The reason is above."
              exit 1
            }
            echo "::endgroup::"
          done

      - name: Apply the migration this run names
        if: github.event_name == 'workflow_dispatch'
        env:
          # The same repository secret the push path uses. The script needs it,
          # and nothing else does: no key, no URL, no project.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # This workflow's own token, so the script can read the repository
          # through the API without spending the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          # The version this run names. A dispatch is no push, so there is no
          # diff to read and no "before" commit: the version comes from here.
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. The product owner adds it as a repository secret (Settings -> Secrets and variables -> Actions -> New repository secret). Nothing is applied without it."
            exit 1
          fi

          # A version is the migration file's own UTC timestamp: fourteen digits.
          # Whitespace around it is a typo and is dropped; anything else that is
          # not fourteen digits is refused here, before anything is fetched.
          version="${VERSION//[[:space:]]/}"

          if ! [[ "${version}" =~ ^[0-9]{14}$ ]]; then
            echo "::error::\"${version}\" is not a version. A version is the migration file's own UTC timestamp, e.g. 20261110035018."
            exit 1
          fi

          # The file for the version, in this checkout. The script finds the file
          # on merged main and refuses a version that is not there; this finds the
          # file here, so the bytes this run verified can be handed to the script
          # as the expectation.
          mapfile -t files < <(git ls-files -- "supabase/migrations/${version}_*.sql")

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No migration file with the version ${version} is in this checkout. The version is the file's own UTC timestamp, e.g. 20261110035018."
            exit 1
          fi

          if [ "${#files[@]}" -gt 1 ]; then
            echo "::error::More than one migration file in this checkout carries the version ${version}:"
            printf '  %s\n' "${files[@]}"
            echo "::error::A version identifies one migration. Refusing to guess which one."
            exit 1
          fi

          file="${files[0]}"

          # The script records the row's `created_by` from this checkout's git
          # identity, and the rows already on dev carry the address of the commit
          # that wrote the migration — the same address the push path records, so
          # a hand-run leaves the same kind of row behind.
          author="$(git log -1 --format='%ae' -- "${file}")"
          git config user.email "${author}"

          # The bytes this run verified, so the script refuses if the file on
          # merged main is not the same file. The script fetches the file from
          # merged main, so a dispatch from another branch still applies main's
          # bytes — or is refused, when this checkout's bytes are not main's.
          sha256="$(sha256sum "${file}" | cut -d' ' -f1)"

          echo "This run applies ${version} (${file})."
          echo "::group::Applying ${version}"
          # The script is `packages/db`'s `db:apply`, run from its own package. Not
          # `pnpm --filter`: a filter that matches no package exits 0 and applies
          # nothing, and this job must not be able to succeed without applying.
          (cd packages/db && pnpm db:apply "${version}" --expect-sha256 "${sha256}") || {
            echo "::endgroup::"
            echo "::error::db:apply refused ${version}. The job fails on purpose — a refusal must be loud. The reason is above."
            exit 1
          }
          echo "::endgroup::"
